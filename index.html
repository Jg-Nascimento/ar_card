<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cartão WebAR - JN Soluções</title>

  <!-- A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { overflow: hidden; font-family: sans-serif; background-color: #000; }

    /* Tela de Carregamento Inicial */
    #loading-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #0f172a; display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 9999; color: #d4af37;
      transition: opacity 0.4s ease;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 40px; height: 40px; border: 3px solid rgba(212, 175, 55, 0.2);
      border-top-color: #d4af37; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Barra de Ações Rápidas (Overlay inferior com tema dourado) */
    #action-overlay {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; z-index: 1000; width: 95%; max-width: 440px;
    }
    .action-btn {
      flex: 1; padding: 10px 4px;
      background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 12px; color: #1a1a1a; font-size: 10px; font-weight: bold;
      text-decoration: none; text-align: center; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6), inset 0 0 4px rgba(255, 255, 255, 0.6);
      transition: transform 0.2s ease, filter 0.2s ease;
    }
    .action-btn:active { transform: scale(0.95); filter: brightness(0.9); }
    .action-icon {
      font-size: 18px;
      margin-bottom: 3px;
      filter: drop-shadow(0px 1px 1px rgba(0, 0, 0, 0.3));
    }
    .action-btn span {
      text-shadow: 0px 1px 0px rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body>

  <!-- Tela de Carregamento -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <p>Carregando Experiência AR...</p>
  </div>

  <!-- Cena AR acionada pelo alvo impresso (targets.mind) -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="cartao-arte" src="./assets/1.png" crossorigin="anonymous">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Entidade vinculada ao cartão físico -->
    <a-entity id="card-target" mindar-image-target="targetIndex: 0">
      <a-image src="#cartao-arte" position="0 0 0" width="1" height="0.56"></a-image>
    </a-entity>
  </a-scene>

  <!-- Botões Flutuantes Dourados na Parte Inferior -->
  <div id="action-overlay">
    <a id="save-contact-btn" class="action-btn">
      <span class="action-icon">👤</span>
      <span>Salvar</span>
    </a>
    <a id="link-whatsapp" class="action-btn" target="_blank">
      <span class="action-icon">💬</span>
      <span>WhatsApp</span>
    </a>
    <a id="link-calendar" class="action-btn" target="_blank">
      <span class="action-icon">📅</span>
      <span>Agenda</span>
    </a>
    <a id="link-instagram" class="action-btn" target="_blank">
      <span class="action-icon">📸</span>
      <span>Instagram</span>
    </a>
    <a id="link-site" class="action-btn" target="_blank">
      <span class="action-icon">🌐</span>
      <span>Site</span>
    </a>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const sceneEl = document.querySelector('a-scene');
      const loadingScreen = document.getElementById('loading-screen');
      const cardTarget = document.getElementById('card-target');

      const dadosContato = {
        whatsapp: "5583991438527",
        instagram: "seu_perfil",
        site: "https://www.jnsolucoes.com",
        calendar: "https://cal.com/ts-tech-technology-a1inp7/reuniao",
        email: "contato@insolucoes.com",
        nome: "Jorge Nascimento"
      };

      document.getElementById('link-whatsapp').href = `https://wa.me/${dadosContato.whatsapp}`;
      document.getElementById('link-instagram').href = `https://instagram.com/${dadosContato.instagram}`;
      document.getElementById('link-site').href = dadosContato.site;
      document.getElementById('link-calendar').href = dadosContato.calendar;

      sceneEl.addEventListener("arReady", () => {
        loadingScreen.classList.add('hidden');
      });

      cardTarget.addEventListener("targetFound", () => {
        if ("vibrate" in navigator) navigator.vibrate(40);
      });

      document.getElementById('save-contact-btn').addEventListener('click', (e) => {
        e.preventDefault();
        const vcardData = [
          "BEGIN:VCARD",
          "VERSION:3.0",
          `FN:${dadosContato.nome}`,
          `TEL;TYPE=CELL:${dadosContato.whatsapp}`,
          `EMAIL:${dadosContato.email}`,
          `URL:${dadosContato.site}`,
          "END:VCARD"
        ].join("\n");

        const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8' });
        const blobUrl = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = 'contato_jn.vcf';
        document.body.appendChild(a);
        a.click();
        
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(blobUrl);
        }, 100);
      });
    });
  </script>
</body>
</html>
