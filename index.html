<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cartão WebAR - Botões 3D</title>

  <!-- A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { overflow: hidden; font-family: sans-serif; background-color: #000; }

    #loading-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #0f172a; display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 9999; color: #fff;
      transition: opacity 0.4s ease;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loading-screen">
    <div class="spinner"></div>
    <p>Carregando Experiência AR...</p>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="cartao-arte" src="./assets/1.png" crossorigin="anonymous">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="objects: .clickable"></a-camera>

    <!-- Ânfora AR presa ao Cartão Físico -->
    <a-entity id="card-target" mindar-image-target="targetIndex: 0">
      
      <!-- Imagem do Cartão no Centro -->
      <a-image src="#cartao-arte" position="0 0 0" width="1" height="0.56"></a-image>

      <!-- BOTÕES INJETADOS DIRETAMENTE ABAIXO DO CARTÃO (3D) -->
      
      <!-- Salvar Contato -->
      <a-plane id="btn-vcard" class="clickable" position="-0.4 -0.38 0.02" height="0.1" width="0.18" color="#2563eb">
        <a-text value="Salvar" align="center" position="0 0 0.01" color="#FFF" width="1.2"></a-text>
      </a-plane>

      <!-- WhatsApp -->
      <a-plane id="btn-wa" class="clickable" position="-0.2 -0.38 0.02" height="0.1" width="0.18" color="#16a34a">
        <a-text value="Whats" align="center" position="0 0 0.01" color="#FFF" width="1.2"></a-text>
      </a-plane>

      <!-- Agenda -->
      <a-plane id="btn-cal" class="clickable" position="0 -0.38 0.02" height="0.1" width="0.18" color="#7c3aed">
        <a-text value="Agenda" align="center" position="0 0 0.01" color="#FFF" width="1.2"></a-text>
      </a-plane>

      <!-- Instagram -->
      <a-plane id="btn-insta" class="clickable" position="0.2 -0.38 0.02" height="0.1" width="0.18" color="#e1306c">
        <a-text value="Insta" align="center" position="0 0 0.01" color="#FFF" width="1.2"></a-text>
      </a-plane>

      <!-- Site -->
      <a-plane id="btn-site" class="clickable" position="0.4 -0.38 0.02" height="0.1" width="0.18" color="#0284c7">
        <a-text value="Site" align="center" position="0 0 0.01" color="#FFF" width="1.2"></a-text>
      </a-plane>

    </a-entity>
  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const sceneEl = document.querySelector('a-scene');
      const loadingScreen = document.getElementById('loading-screen');
      const cardTarget = document.getElementById('card-target');

      const dadosContato = {
        whatsapp: "5583991438527",
        instagram: "seu_perfil",
        site: "https://www.jnsolucoes.com",
        calendar: "https://cal.com/ts-tech-technology-a1inp7/reuniao",
        email: "contato@insolucoes.com",
        nome: "Jorge Nascimento"
      };

      sceneEl.addEventListener("arReady", () => {
        loadingScreen.classList.add('hidden');
      });

      cardTarget.addEventListener("targetFound", () => {
        if ("vibrate" in navigator) navigator.vibrate(40);
      });

      // Eventos de clique nos elementos 3D
      document.getElementById('btn-wa').addEventListener('click', () => {
        window.open(`https://wa.me/${dadosContato.whatsapp}`, '_blank');
      });

      document.getElementById('btn-insta').addEventListener('click', () => {
        window.open(`https://instagram.com/${dadosContato.instagram}`, '_blank');
      });

      document.getElementById('btn-site').addEventListener('click', () => {
        window.open(dadosContato.site, '_blank');
      });

      document.getElementById('btn-cal').addEventListener('click', () => {
        window.open(dadosContato.calendar, '_blank');
      });

      document.getElementById('btn-vcard').addEventListener('click', () => {
        const vcardData = [
          "BEGIN:VCARD",
          "VERSION:3.0",
          `FN:${dadosContato.nome}`,
          `TEL;TYPE=CELL:${dadosContato.whatsapp}`,
          `EMAIL:${dadosContato.email}`,
          `URL:${dadosContato.site}`,
          "END:VCARD"
        ].join("\n");

        const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8' });
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = 'contato_jn.vcf';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(blobUrl);
        }, 100);
      });
    });
  </script>
</body>
</html>
